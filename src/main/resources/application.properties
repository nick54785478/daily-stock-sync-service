spring.application.name=nifi-demo
# h2
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.sql.init.username=sa
spring.sql.init.password=
#spring.sql.init.schema-locations=classpath:/sql/schema.sql
#spring.sql.init.data-locations=classpath:/sql/data.sql
spring.sql.init.mode=always
#spring.sql.init.platform=h2
spring.sql.init.continue-on-error = true
 
#spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
 
# hibernate configuration
#spring.jpa.hibernate.ddl-auto = none
spring.jpa.hibernate.ddl-auto = create
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
 
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.format_sql=false
#命名規則
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.main.allow-bean-definition-overriding=true

#### kafka ####
# 告訴應用程式應該連接到哪一個或哪幾個 Kafka broker 來發送和接收消息
spring.kafka.bootstrap-servers=localhost:9092


## Producer 配置
# 發生錯誤，重送次數
spring.kafka.producer.retries=5 
spring.kafka.producer.batch-size=16384
spring.kafka.producer.buffer-memory=33554432
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=1

## Consumer 配置
spring.kafka.consumer.auto-commit-interval=1000
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=stock-consumer-group
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.consumer.properties.session.timeout.ms=15000

## Listener 配置
spring.kafka.listener.concurrency=5
#spring.kafka.listener.ack-mode=manual-immediate
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.listener.ack-mode=record
logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka=INFO
logging.level.org.springframework.kafka.listener.KafkaMessageListenerContainer=DEBUG